<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Placement Management System - Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;min-height:100vh}header{background:#1f2937;color:white;text-align:center;padding:25px 15px}header h1{margin:0 0 8px}header p{margin:0;color:#d1d5db}.container{width:90%;max-width:450px;margin:40px auto}.card{background:white;padding:28px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.12)}.tabs{display:flex;margin-bottom:25px;border-bottom:1px solid #ddd}.tab{width:50%;padding:12px;border:0;background:transparent;font-size:16px;font-weight:bold;cursor:pointer;margin:0}.tab.active{color:#2563eb;border-bottom:3px solid #2563eb}.form{display:none}.form.active{display:block}.form-group{margin-bottom:16px}label{display:block;margin-bottom:6px;font-weight:bold;color:#374151}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:15px}.submit-btn{width:100%;padding:12px;border:0;border-radius:6px;background:#2563eb;color:white;font-size:16px;cursor:pointer}.message{display:none;margin-top:18px;padding:12px;border-radius:6px;text-align:center}.message.success,.message.error{display:block}.success{background:#d1fae5;color:#065f46}.error{background:#fee2e2;color:#991b1b}.note{margin-top:20px;text-align:center;color:#6b7280;font-size:13px}</style></head><body><header><h1>Student Placement Management System</h1><p>Login or create your account</p></header><div class="container"><div class="card"><div class="tabs"><button class="tab active" id="loginTab" onclick="showLogin()">Login</button><button class="tab" id="registerTab" onclick="showRegister()">Register</button></div><form id="loginForm" class="form active"><div class="form-group"><label for="loginEmail">Email</label><input type="email" id="loginEmail" placeholder="Enter your email" required></div><div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required></div><button type="submit" class="submit-btn">Login</button></form><form id="registerForm" class="form"><div class="form-group"><label for="registerName">Name</label><input type="text" id="registerName" placeholder="Enter your name" required></div><div class="form-group"><label for="registerEmail">Email</label><input type="email" id="registerEmail" placeholder="Enter your email" required></div><div class="form-group"><label for="registerPassword">Password</label><input type="password" id="registerPassword" placeholder="Create a password" required></div><div class="form-group"><label for="registerRole">Role</label><select id="registerRole" required><option value="STUDENT">Student</option><option value="ADMIN">Admin</option><option value="COMPANY">Company</option></select></div><button type="submit" class="submit-btn">Create Account</button></form><div id="message" class="message"></div><div class="note">Student Placement Management System</div></div></div><script>const AUTH_API_URL="/api/auth";function showLogin(){loginForm.classList.add("active");registerForm.classList.remove("active");loginTab.classList.add("active");registerTab.classList.remove("active");clearMessage()}function showRegister(){registerForm.classList.add("active");loginForm.classList.remove("active");registerTab.classList.add("active");loginTab.classList.remove("active");clearMessage()}function showMessage(text,type){const m=document.getElementById("message");m.innerText=text;m.className="message "+type}function clearMessage(){const m=document.getElementById("message");m.innerText="";m.className="message"}registerForm.addEventListener("submit",async e=>{e.preventDefault();const user={name:registerName.value,email:registerEmail.value,password:registerPassword.value,role:registerRole.value};try{const r=await fetch(`${AUTH_API_URL}/register`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(user)});if(!r.ok)throw new Error();showMessage(await r.text(),"success");registerForm.reset();setTimeout(()=>{showLogin();loginEmail.value=user.email},800)}catch(err){console.error(err);showMessage("Registration failed. Please try again.","error")}});loginForm.addEventListener("submit",async e=>{e.preventDefault();const data={email:loginEmail.value,password:loginPassword.value};try{const r=await fetch(`${AUTH_API_URL}/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!r.ok)throw new Error();const token=await r.text();localStorage.setItem("jwtToken",token);showMessage("Login successful! Redirecting...","success");setTimeout(()=>window.location.href="/",800)}catch(err){console.error(err);showMessage("Invalid email or password.","error")}});</script></body></html>
